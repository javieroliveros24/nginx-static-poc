services:
  web-poc:
    build:
      context: .
      dockerfile: Dockerfile
    image: aerologix-static-poc:1.0
    container_name: aerologix_web_poc
    ports:
      - "8085:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./conf/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped